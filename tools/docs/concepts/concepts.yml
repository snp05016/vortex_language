  # ---- Specification-only vocabulary ---------------------------------------

  - id: normative
    term: normative
    short: Required for conformance; informative text explains but adds no requirements.
    definition: >-
      Required for language conformance. In the specification, must, must not,
      required and shall state requirements; may and implementation-defined
      permit a choice; should gives guidance only.
    spec: >-
      Required for language conformance. Informative explanations help readers
      but do not create additional requirements. The specification chapters are
      normative; see [Document authority](conformance.md#11-document-authority).
    spec_ref: specification/index.md#normative-vocabulary
    introduced_in: specification/index.md
    requires: []
    used_in:
      - authorship.md
    recall_question: What do we call specification text that is required for conformance, as opposed to informative text?
    recall_answer: Normative. Words such as must and shall state requirements; informative explanations add none.

  - id: implementation-defined
    term: implementation-defined
    short: Behavior where the specification permits a choice and requires the implementation to document it.
    definition: >-
      Behavior for which the specification permits a choice and requires the
      implementation to document that choice and apply it consistently. It is
      allowed only where the specification says so.
    spec: >-
      Describes behavior for which the specification permits a choice and
      requires the implementation to document that choice. Every such behavior,
      and every implementation limit, is listed in [Implementation-defined
      behavior and
      limits](conformance.md#110-implementation-defined-behavior-and-limits).
    spec_ref: specification/conformance.md#16-implementation-defined-behavior
    introduced_in: specification/conformance.md
    requires: [normative]
    used_in: []
    recall_question: What do we call behavior where the specification lets the implementation choose, as long as the choice is documented?
    recall_answer: Implementation-defined behavior. It is allowed only where the specification explicitly permits it.

  - id: binding
    term: binding
    short: The association between a name and a declaration or storage location.
    definition: >-
      The association between a name and a declaration or storage location.
      Name resolution binds each name to the declaration it refers to.
    spec: The association between a name and a declaration or storage location.
    spec_ref: specification/glossary.md
    introduced_in: specification/glossary.md
    requires: [identifier, declaration]
    used_in:
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
    recall_question: What does the specification call the association between a name and a declaration or storage location?
    recall_answer: A binding. Name resolution binds each name to what it refers to.

  # ---- Compiler guide overview ---------------------------------------------

  - id: compiler
    term: compiler
    short: A program that translates programs; it reads source code, checks it and writes code a machine can run.
    definition: >-
      A program that translates other programs. It reads source code, works out
      what it means, rejects programs that break the rules with a clear
      message, and writes out code a machine can run.
    introduced_in: compiler/guide/index.md
    requires: []
    used_in:
      - compiler/guide/stage-0-workbench.md
      - compiler/guide/stage-1-source-and-diagnostics.md
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
    recall_question: What do we call a program that reads source code, checks it, and writes out code a machine can run?
    recall_answer: A compiler. It also rejects programs that break the rules and explains the problem.

  - id: source-code
    term: source code
    short: The text of a program as a person wrote it.
    definition: The text of a program as a person wrote it; the input a compiler reads.
    introduced_in: compiler/guide/index.md
    requires: [compiler]
    used_in:
      - compiler/guide/stage-0-workbench.md
      - compiler/guide/stage-6-first-machine-code.md
    recall_question: What is the text of a program as a person wrote it called?
    recall_answer: Source code. It is what the compiler reads.

  - id: machine-code
    term: machine code
    short: Instructions in the numeric form a processor executes directly.
    definition: >-
      Instructions in the numeric form a processor executes directly, which is
      what a compiler ultimately produces. A file of machine code that the
      operating system can start is an executable.
    introduced_in: compiler/guide/index.md
    requires: [compiler]
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/architecture.md
      - compiler/parser-design.md
      - gpu/g7-programming-models.md
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: What do we call instructions in the numeric form a processor can execute directly?
    recall_answer: Machine code. A file of it that the operating system can start is an executable.

  - id: code-generator
    term: code generator
    short: The compiler stage that turns the intermediate representation into instructions for a real processor.
    definition: >-
      The compiler stage that turns the lowered program, written in an
      intermediate representation, into instructions for a real processor.
    introduced_in: compiler/guide/index.md
    requires: [compiler, machine-code]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: Which compiler stage turns the lowered program into instructions for a real processor?
    recall_answer: The code generator. A linker then joins its output with the runtime library to make the executable.

  # ---- Compiler guide 0. The workbench -------------------------------------

  - id: driver
    term: driver
    short: The program a person runs to use the compiler; it runs the stages in order and reports the outcome.
    definition: >-
      The program a person runs to use the compiler. It reads the command line,
      runs the stages in order, and reports the outcome. For Vortex it is the
      `vortex` command.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [compiler]
    used_in:
      - compiler/guide/stage-2-lexer.md
      - compiler/guide/stage-6-first-machine-code.md
    recall_question: What is the program a person runs to use the compiler, which runs the stages in order and reports the outcome?
    recall_answer: The driver. For Vortex it is the `vortex` command.

  - id: build
    term: build
    short: The process that turns the compiler's own source code into the vortex program.
    definition: >-
      The process that turns the compiler's own source code into the `vortex`
      program. A build system is the tool that knows the recipe.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [compiler, source-code]
    used_in:
      - compiler/guide/stage-3-parser-and-tree.md
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/parser-design.md
    recall_question: What is the process that turns the compiler's own source code into the `vortex` program called?
    recall_answer: The build. The build system is the tool that knows the recipe.

  - id: build-system
    term: build system
    short: The tool that knows the recipe for building the compiler.
    definition: The tool that knows the recipe for building the compiler from its source code.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [build]
    used_in:
      - roadmap.md
    recall_question: Which tool knows the recipe for building the compiler?
    recall_answer: The build system. It turns the compiler's source code into the `vortex` program.

  - id: clean-configuration
    term: clean configuration
    short: A build that starts from nothing, with no leftover files and no settings that exist on one machine only.
    definition: >-
      A build that starts from nothing, with no files left over from an earlier
      build and no settings that exist only on one person's machine.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [build]
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - roadmap.md
    recall_question: What do we call a build that starts from nothing, with no leftover files or machine-specific settings?
    recall_answer: A clean configuration, with no files from an earlier build and no settings that exist only on one person's machine.

  - id: exit-status
    term: exit status
    short: A small number a program hands back when it finishes; by convention zero means success.
    definition: >-
      A small number every program hands back to whoever started it when it
      finishes. By long convention zero means success and anything else means
      failure; test runners and build scripts read it.
    spec: >-
      The number a finished program hands back to whatever started it. A Vortex
      program exits with 0 when `main` returns and with 101 after a runtime
      error; see [Diagnostics](diagnostics.md#106-runtime-reporting).
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: []
    used_in:
      - compiler/guide/stage-1-source-and-diagnostics.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
    recall_question: What number does a program hand back when it finishes, and which value means success?
    recall_answer: Its exit status. By convention zero means success and anything else means failure.

  - id: test
    term: test
    short: One small automatic check with a pass or fail answer.
    definition: One small, automatic check with a definite answer, pass or fail.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: []
    used_in:
      - compiler/guide/stage-3-parser-and-tree.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
      - backend/b1-simplest-backend.md
    recall_question: What do we call one small, automatic check with a definite pass or fail answer?
    recall_answer: A test. It either passes or fails, with nothing in between.

  - id: test-case
    term: test case
    short: One source file plus a description of what should happen to it.
    definition: >-
      The material for one test. For a compiler this is usually one Vortex
      source file together with a description of what should happen to it.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [test]
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-11-release.md
    recall_question: For a compiler, what is the material for one test usually made of, and what is it called?
    recall_answer: A test case, one Vortex source file together with a description of what should happen to it.

  - id: valid-program
    term: valid program
    short: A program the specification says must be accepted.
    definition: A Vortex program the specification says must be accepted.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: []
    used_in:
      - compiler/guide/stage-3-parser-and-tree.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
    recall_question: What do we call a program the specification says the compiler must accept?
    recall_answer: A valid program. Its opposite, an invalid program, must be rejected.

  - id: invalid-program
    term: invalid program
    short: A program written on purpose to break one rule, which the compiler must reject.
    definition: >-
      A program the specification says must be rejected, written on purpose to
      break exactly one rule.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [valid-program]
    used_in:
      - compiler/guide/stage-1-source-and-diagnostics.md
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
    recall_question: What do we call a test program written on purpose to break exactly one rule?
    recall_answer: An invalid program. The compiler must reject it.

  - id: expected-output
    term: expected output
    short: The written-down result a test case should produce, such as printed output or an error's kind and location.
    definition: >-
      A written-down record of what should happen when the compiler meets a
      test case, such as the program's printed output or the kind and location
      of the error. The test passes only if the real output matches it.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [test-case]
    used_in:
      - compiler/guide/stage-1-source-and-diagnostics.md
      - compiler/guide/stage-2-lexer.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
    recall_question: Which written record does a test compare against to decide whether it passed?
    recall_answer: The expected output, such as the program's printed text or the error's kind and location.

  - id: test-runner
    term: test runner
    short: A program that runs every test case, compares the results with the expected output and reports pass or fail.
    definition: >-
      A program that finds all the test cases, runs the compiler on each one,
      compares what happened with the expected output, and reports a pass or a
      fail for each.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [test-case, expected-output]
    used_in:
      - compiler/guide/stage-11-release.md
      - roadmap.md
    recall_question: Which program finds all the test cases, runs the compiler on each, and reports pass or fail?
    recall_answer: The test runner. It compares what happened with each test's expected output.

  - id: regression
    term: regression
    short: Something that used to work and has stopped working.
    definition: >-
      Something that used to work and has stopped working because of a later
      change. Running every old test after every change is how you catch one.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [test]
    used_in:
      - compiler/guide/stage-11-release.md
    recall_question: What do we call something that used to work and has stopped working after a change, and how do you catch it?
    recall_answer: A regression. You catch it by running every old test after every change.

  - id: empty-compiler
    term: empty compiler
    tooltip: true
    short: A compiler whose driver runs and exits properly but does not translate anything yet.
    definition: >-
      A compiler whose driver runs and exits properly but does no translation
      yet. Milestone 0 is complete when the empty compiler builds reliably and
      the test runner can report a passing and a failing test.
    introduced_in: compiler/guide/stage-0-workbench.md
    requires: [driver, build]
    used_in:
      - roadmap.md
    recall_question: What do we call a compiler whose driver runs and exits properly but translates nothing yet?
    recall_answer: An empty compiler. Milestone 0 is done when it builds reliably and the test runner reports a pass and a fail.

  # ---- Compiler guide 1. Source text and error messages --------------------

  - id: source-file
    term: source file
    short: The file of Vortex text handed to the compiler.
    definition: >-
      The file of Vortex text the user hands to the compiler. The specification
      defines it as a sequence of source characters provided to the compiler.
