    recall_question: >-
      In `struct Point { x: f32, y: f32 }`, what are `x` and `y` called, and
      how do you read one?
    recall_answer: Fields. You read one through a value with a dot, as in `point.x`.

  # ---- Language tour 8. Runtime and numerical rules ------------------------

  - id: compile-time
    term: compile time
    short: While the compiler is working on the source, before any executable exists.
    definition: >-
      While the compiler is working on the source, before any executable
      exists. Errors the compiler can prove, such as a known out-of-bounds
      index, are reported at compile time.
    spec: >-
      The period in which the compiler translates and validates a program
      before that program executes.
    spec_ref: specification/glossary.md
    introduced_in: language-tour/06-runtime-and-numerical-rules.md
    requires: []
    used_in:
      - language-tour/05-types-planned-for-later.md
      - specification/index.md
      - specification/grammar.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/parser-design.md
      - gpu/g2-simt.md
      - gpu/g4-memory-performance.md
      - gpu/g10-matmul-ladder.md
      - gpu/g13-tile-languages.md
      - gpu/g15-systolic-arrays.md
    recall_question: What do we call the period while the compiler is working on the source, before any executable exists?
    recall_answer: Compile time. Errors found then are reported before the program can run.

  - id: run-time
    term: run time
    short: While the finished executable is running.
    definition: >-
      While the finished executable is running. Some rules, such as whether an
      index is in bounds or a divisor is zero, can only be checked at run time.
    spec: The period in which a compiled Vortex program executes.
    spec_ref: specification/glossary.md
    introduced_in: language-tour/06-runtime-and-numerical-rules.md
    requires: [compile-time]
    used_in:
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - gpu/g7-programming-models.md
      - gpu/g8-isas-and-irs.md
    recall_question: What do we call the period while the finished executable is running?
    recall_answer: Run time. Checks that depend on values known only then are made at run time.

  - id: runtime-check
    term: runtime check
    short: A small test placed in the generated code before an operation that might be invalid.
    definition: >-
      A small test the compiler places in the generated code, just before an
      operation that might be invalid, such as an array access or an integer
      division. It may be left out only when the compiler can prove the
      operation safe.
    spec_ref: specification/conformance.md#14-static-and-dynamic-rules
    introduced_in: language-tour/06-runtime-and-numerical-rules.md
    requires: [run-time, bounds-check, cast]
    used_in:
      - specification/conformance.md
      - specification/diagnostics.md
      - philosophy.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-9-runtime-safety.md
    recall_question: What does the compiler place in generated code just before an operation that might fail, such as dividing by a variable?
    recall_answer: A runtime check. It may be left out only when the compiler can prove the operation safe.

  - id: runtime-error
    term: runtime error
    short: What happens when a runtime check fails; the program stops and reports the problem.
    definition: >-
      What happens when a runtime check fails: the program stops and reports
      what went wrong. Out-of-bounds access, integer division by zero, integer
      overflow and impossible casts are runtime errors in v0.1.
    spec_ref: specification/diagnostics.md#runtime-error
    introduced_in: language-tour/06-runtime-and-numerical-rules.md
    requires: [runtime-check]
    used_in:
      - specification/conformance.md
      - specification/diagnostics.md
      - compiler/guide/stage-1-source-and-diagnostics.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - optimize/o1-optimizer-contract.md
      - optimize/o8-loops.md
    recall_question: What happens when a running Vortex program divides an integer by zero?
    recall_answer: A runtime error. The program stops and reports what went wrong.

  # ---- Language tour 9. Planned types --------------------------------------

  - id: slice
    term: slice
    short: A planned view into part of an array whose length is known only at run time; not in v0.1.
    definition: >-
      A planned type, written `&[T]`, that would view part of an array without
      owning or copying it. Its length would be known only while the program
      runs. Slices are not part of v0.1; use a reference to a fixed-size array
      instead.
    introduced_in: language-tour/05-types-planned-for-later.md
    requires: [array, reference]
    used_in:
      - language-tour/07-kernels-and-parallel-execution.md
      - specification/arrays.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/ast-guide.md
    recall_question: Which planned type would view part of an array with a length known only at run time, and what do you use in v0.1 instead?
    recall_answer: A slice, such as `&[f32]`. In v0.1 you use a reference to a fixed-size array, such as `&[f32; 4]`.

  - id: vector
    term: vector
    short: A planned growable array type whose length can change at run time; not in v0.1.
    definition: >-
      A planned type, `Vector<T>`, that would own contiguous memory whose length
      can grow or shrink while the program runs. It is not part of v0.1, which
      has no generics or methods.
    introduced_in: language-tour/05-types-planned-for-later.md
    requires: [array]
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/parser-design.md
    recall_question: Which planned type would hold values whose count can grow or shrink while the program runs?
    recall_answer: A vector, `Vector<T>`. It is future work; v0.1 has only fixed-size arrays.

  - id: tensor
    term: tensor
    short: A planned multidimensional numeric type; fixed-size multidimensional arrays stand in for it in v0.1.
    definition: >-
      A planned multidimensional type for Vortex's main numerical workloads,
      possibly written like `Tensor<f32, [128, 256]>`. Its syntax has not been
      decided; fixed-size multidimensional arrays are the v0.1 replacement.
    introduced_in: language-tour/05-types-planned-for-later.md
    requires: [array, dimension]
    used_in:
      - philosophy.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
      - gpu/g11-matrix-units.md
    recall_question: Which planned type is meant for multidimensional numerical data, and what replaces it in v0.1?
    recall_answer: A tensor. In v0.1 you use a fixed-size multidimensional array such as `[f32; 4, 4]`.

  # ---- Language tour 10. Planned kernels and parallelism -------------------

  - id: kernel
    term: kernel
    short: A planned kind of function for large amounts of numerical data, possibly run on a GPU; not in v0.1.
    definition: >-
      A planned kind of function that processes a large amount of numerical
      data and could eventually run on a GPU or another accelerator. The
      `kernel` keyword and parallel syntax are not part of v0.1.
    introduced_in: language-tour/07-kernels-and-parallel-execution.md
    requires: [function]
    used_in:
      - philosophy.md
      - compiler/guide/stage-11-release.md
