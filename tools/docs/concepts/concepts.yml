  - id: constant-expression
    term: constant expression
    short: "In v0.1, an integer constant expression: integer literals, each optionally preceded by unary -, combined..."
    definition: >-
      In v0.1, an integer constant expression: integer literals, each optionally
      preceded by unary -, combined with parentheses and the binary operators +,
      -, , / and %. Names and calls are never constant expressions. See
      Expressions.
    spec: >-
      In v0.1, an integer constant expression: integer literals, each optionally
      preceded by unary `-`, combined with parentheses and the binary operators
      `+`, `-`, `*`, `/` and `%`. Names and calls are never constant
      expressions. See [Expressions](expressions.md#512-constant-expressions).
