    requires: []
    recall_question: "Which term does the specification use for this idea: an operation that must detect an invalid case, such as integer overflow, division by zero or an...?"
    recall_answer: >-
      Checked operation. An operation that must detect an invalid case, such as
      integer overflow, division by zero or an out-of-bounds index, and fail
      with a diagnostic instead of producing a wrong value. See Expressions 5.5
