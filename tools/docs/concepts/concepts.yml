    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
    recall_question: What is the file of Vortex text handed to the compiler called?
    recall_answer: The source file, a sequence of source characters provided to the compiler.

  - id: character
    term: character
    short: One symbol of text as a person would count it.
    definition: >-
      One symbol of text as a person would count it, such as a letter, a digit,
      a space or `λ`. A character may need more than one byte.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: []
    used_in:
      - compiler/guide/stage-2-lexer.md
      - compiler/guide/stage-8-data-in-memory.md
      - roadmap.md
    recall_question: What is one symbol of text as a person would count it, such as a letter or `λ`, called?
    recall_answer: A character. Some characters fit in one byte; others need several.

  - id: byte
    term: byte
    short: The unit files and memory are stored in; it holds 8 bits, and one character may need several.
    definition: >-
      The unit a file, and memory, is actually stored in. A byte holds 8 bits,
      one of 256 values; some characters fit in one byte and others need
      several.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [character]
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
    recall_question: What is the 8-bit unit that files and memory are stored in called?
    recall_answer: A byte. It holds one of 256 values, and one character may need several bytes.

  - id: encoding
    term: encoding
    short: The rule that says which bytes stand for which characters.
    definition: The rule that says which bytes stand for which characters. UTF-8 is the most common encoding.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [character, byte]
    used_in: []
    recall_question: Which rule says which bytes stand for which characters?
    recall_answer: An encoding. UTF-8 is the most common one.

  - id: utf-8
    term: UTF-8
    abbr: UTF-8
    short: The most common text encoding; plain English letters take one byte, other characters two to four.
    definition: >-
      The most common text encoding. ASCII characters, such as plain English
      letters and digits, take one byte each; other characters take two to
      four. Vortex `String` values store UTF-8 text.
    spec_ref: specification/types-and-values.md#46-characters-and-strings
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [encoding]
    used_in:
      - compiler/guide/stage-2-lexer.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-8-data-in-memory.md
      - roadmap.md
    recall_question: Which encoding stores plain English letters in one byte and other characters in two to four, and is used by Vortex strings?
    recall_answer: UTF-8. A Vortex `String` stores UTF-8 text.

  - id: offset
    term: offset
    short: A position in a file counted from its start; easy for a program, hard for a person to find.
    definition: >-
      A position in the file counted from the start, such as the 28th
      character. It is simple for a program to store and compare, but useless
      for a person trying to find the place.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [source-file]
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
    recall_question: What do we call a position in a source file counted from its start?
    recall_answer: An offset. It is easy for a program to store, but people need line and column instead.

  - id: line-and-column
    term: line and column
    short: A position a person can find; which row of the file, and how far along it.
    definition: >-
      A position a person can find. The line is which row of the file; the
      column is how far along that row.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [offset]
    used_in: []
    recall_question: How does a diagnostic describe a position so that a person can find it?
    recall_answer: By line and column, which row of the file and how far along that row.

  - id: source-span
    term: source span
    tooltip: true
    short: The start and length of the source text a token, node or diagnostic came from.
    definition: >-
      A stretch of source text, given as a start position and a length. Every
      token, every tree node and every error message carries one.
    spec: >-
      A byte offset from the start of the source file and a length in bytes,
      identifying the source text of a token, AST node, or diagnostic.
      Diagnostics show the start as a line and column, both counted from 1; see
      [Conformance 1.7](conformance.md#17-source-locations).
    spec_ref: specification/conformance.md#17-source-locations
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [offset]
    used_in:
      - compiler/guide/stage-2-lexer.md
      - compiler/guide/stage-3-parser-and-tree.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
      - backend/d1-debug-info.md
      - mlir/m2-reading-mlir.md
    recall_question: What does every token, tree node and error message carry to say exactly which stretch of source it came from?
    recall_answer: A source span, a start position and a length.

  - id: diagnostic
    term: diagnostic
    short: A message from the compiler about a problem in the source.
    definition: >-
      A message from the compiler about a problem in the source. In Vortex v0.1
      every diagnostic is an error, and each one needs a source location.
    spec_ref: specification/diagnostics.md#101-required-diagnostic-data
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [compiler, source-file]
    used_in:
      - compiler/guide/stage-2-lexer.md
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
      - compiler/parser-design.md
    recall_question: What do we call a message from the compiler about a problem in the source?
    recall_answer: A diagnostic. In v0.1 every diagnostic is an error and carries a source location.

  - id: category
    term: category
    short: The kind of problem a diagnostic reports, such as a lexical error or a type error; the spec lists eight.
    definition: >-
      The kind of problem a diagnostic reports, such as a lexical error or a
      type error. The specification lists eight categories.
    spec_ref: specification/diagnostics.md#102-categories
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [diagnostic]
    used_in:
      - compiler/guide/stage-2-lexer.md
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-11-release.md
      - compiler/ast-guide.md
    recall_question: What sorts diagnostics into kinds such as lexical error or type error, and how many kinds does the specification list?
    recall_answer: The category. The specification lists eight.

  - id: primary-span
    term: primary span
    tooltip: true
    short: The one stretch of source a diagnostic is about, where its marker points.
    definition: The one span a diagnostic is about, the place its marker points at.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [diagnostic, source-span]
    used_in: []
    recall_question: Which span of a diagnostic is the one it is about, where the marker points?
    recall_answer: The primary span. Notes may point at other, related spans.

  - id: note
    term: note
    short: An extra line on a diagnostic, often pointing at a related place in the source.
    definition: >-
      An extra line attached to a diagnostic, often pointing at a second,
      related span, such as the declaration that explains why the primary span
      is wrong.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [primary-span]
    used_in:
      - compiler/guide/stage-3-parser-and-tree.md
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
    recall_question: Which extra line on a diagnostic can point at a second, related place, such as an earlier declaration?
    recall_answer: A note. It helps explain why the primary span is wrong.

  - id: marker
    term: marker
    short: Symbols printed under a source line to show which characters a diagnostic means; ^ is a caret.
    definition: >-
      The row of symbols printed under a source line to show exactly which
      characters the diagnostic means. Clang calls a single `^` the caret.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [primary-span]
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
    recall_question: What is printed under a source line to show exactly which characters a diagnostic means?
    recall_answer: A marker, such as a caret `^` under the characters in question.

  - id: source-manager
    term: source manager
    tooltip: true
    short: The part of the compiler that holds the source text and turns positions into locations, reading no syntax.
    definition: >-
      The part of the compiler that holds the source text and turns positions
      into locations a person can find, without interpreting any syntax.
    introduced_in: compiler/guide/stage-1-source-and-diagnostics.md
    requires: [source-file, line-and-column]
    used_in:
      - compiler/architecture.md
    recall_question: Which part of the compiler holds the source text and turns offsets into lines and columns?
    recall_answer: The source manager. It never interprets any syntax.

  # ---- Compiler guide 2. The lexer -----------------------------------------

  - id: lexer
    term: lexer
    aliases: [scanner]
    short: The compiler stage that groups characters into tokens.
    definition: >-
      The compiler stage that groups the characters of a source file into
      tokens. It skips whitespace and comments, keeps each token's spelling and
      source span, and reports malformed token text.
    spec_ref: specification/lexical-structure.md
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token, source-file]
    used_in:
      - compiler/guide/stage-3-parser-and-tree.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
      - compiler/parser-design.md
    recall_question: Which compiler stage groups characters into tokens and skips whitespace and comments?
    recall_answer: The lexer, also called the scanner.

  - id: token
    term: token
    short: One unit of the language, such as a keyword, name, number or symbol, with a kind, spelling and location.
    definition: >-
      One unit of the language, like a word in a sentence, such as a keyword, a
      name, a number or a symbol. Each token has a kind, a spelling and a source
      span.
    spec: One lexical unit with a kind, source spelling, and source span.
    spec_ref: specification/lexical-structure.md#28-token-source-data
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [character]
    used_in:
      - compiler/guide/stage-3-parser-and-tree.md
      - roadmap.md
      - compiler/architecture.md
      - compiler/parser-design.md
      - compiler/ast-guide.md
    recall_question: What do we call one unit of the language, such as a keyword, a name, a number or a symbol?
    recall_answer: A token. Each token has a kind, a spelling and a source span.

  - id: token-kind
    term: token kind
    short: Which sort of token something is, such as keyword, identifier or integer literal.
    definition: >-
      Which sort of token something is, such as a keyword, an identifier, an
      integer literal or a particular operator.
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token]
    used_in:
      - compiler/guide/stage-11-release.md
      - compiler/parser-design.md
    recall_question: Which property of a token says whether it is a keyword, an identifier, an integer literal or an operator?
    recall_answer: Its token kind. With the spelling and the source span, it describes the token.

  - id: spelling
    term: spelling
    aliases: [lexeme]
    short: The exact characters a token was made from; many books call it the lexeme.
    definition: >-
      The exact characters a token was made from, as they appear in the file.
      Many books call it the lexeme.
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token]
    used_in:
      - compiler/architecture.md
    recall_question: What do we call the exact characters a token was made from, and what do many books call it?
    recall_answer: Its spelling, also called the lexeme.

  - id: token-stream
    term: token stream
    tooltip: true
    short: The whole sequence of tokens for a file, in order, ending with an end-of-file token.
    definition: >-
      The whole sequence of tokens for one file, in order, ending with the
      end-of-file token. It is what the lexer hands to the parser.
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token]
    used_in:
      - roadmap.md
      - compiler/architecture.md
      - compiler/parser-design.md
    recall_question: What does the lexer hand to the parser?
    recall_answer: The token stream, every token of the file in order, ending with an end-of-file token.

  - id: keyword
    term: keyword
    short: A word the language reserves, such as let or while, that cannot be used as a name.
    definition: >-
      A word the language reserves for itself, such as `let`, `fn` or `while`.
      A keyword cannot be used as a name; primitive type names such as `i32`
      and `String` are keywords too.
    spec_ref: specification/lexical-structure.md#24-keywords
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token, identifier]
    used_in:
      - compiler/guide/stage-3-parser-and-tree.md
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
    recall_question: What do we call a word such as `let`, `fn` or `while` that the language reserves and that cannot be used as a name?
    recall_answer: A keyword. Matching is case-sensitive, so `String` is a keyword but `string` is an identifier.

  - id: whitespace
    term: whitespace
    short: Spaces, tabs and line breaks; they separate tokens and mean nothing else.
    definition: >-
      Spaces, tabs and line breaks. In Vortex they separate tokens and carry no
      other meaning; a line break does not end a statement.
    spec_ref: specification/lexical-structure.md#21-whitespace-and-line-boundaries
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token]
    used_in: []
    recall_question: What are spaces, tabs and line breaks called, and what do they do in Vortex?
    recall_answer: Whitespace. It separates tokens and means nothing else; a line break does not end a statement.

  - id: longest-match
    term: longest match
    aliases: [maximal munch]
    tooltip: true
    short: When several tokens could start at the same place, the lexer takes the longest valid one.
    definition: >-
      The rule that when several tokens could start at the same place, the
      lexer takes the longest one that is valid. It is also called maximal
      munch.
    spec_ref: specification/lexical-structure.md#26-operators-and-punctuation
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token, lexer]
    used_in: []
    recall_question: Why does the lexer read `<=` as one token rather than `<` followed by `=`?
    recall_answer: Because of the longest-match rule, also called maximal munch. When several tokens could start at the same place, the lexer takes the longest valid one.

  - id: end-of-file-token
    term: end-of-file token
    tooltip: true
    short: A token with no spelling that marks the end of the input.
    definition: >-
      A token with no spelling that marks the end of the input, so later stages
      have a clear place to stop.
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token-stream]
    used_in: []
    recall_question: Which token has no spelling and marks where the input ends?
    recall_answer: The end-of-file token. It gives later stages a clear place to stop.

  - id: lexical-error
    term: lexical error
    short: A diagnostic saying some characters cannot form any valid token.
    definition: >-
      A diagnostic saying that some characters cannot form any valid token,
      such as an unterminated string or an unsupported escape.
    spec_ref: specification/diagnostics.md#lexical-error
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [diagnostic, token]
    used_in: []
    recall_question: Which kind of diagnostic says that some characters cannot form any valid token?
    recall_answer: A lexical error, for example an unterminated string or an unsupported escape.

  - id: tokenizing
    term: tokenizing
    aliases: [lexing]
    short: Grouping characters into tokens; the lexer's job.
    definition: Grouping characters into tokens, the job of the lexer. The specification calls it lexing.
    spec: Converting source characters into tokens.
    spec_ref: specification/glossary.md
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [token, lexer]
    used_in: []
    recall_question: What do we call the work of grouping characters into tokens?
    recall_answer: Tokenizing, which the specification calls lexing.

  - id: decoded-value
    term: decoded value
    tooltip: true
    short: The value a literal actually stands for, with escape sequences turned into real characters.
    definition: >-
      The value a literal actually stands for, with escape sequences turned
      into the real characters; the two characters `\n` decode to one line
      feed.
    introduced_in: compiler/guide/stage-2-lexer.md
    requires: [literal, escape-sequence]
    used_in: []
    recall_question: What is the value a literal actually stands for, after `\n` has become a real line feed, called?
    recall_answer: Its decoded value. The lexer must preserve it for each literal.

  # ---- Compiler guide 3. The parser and the syntax tree --------------------

  - id: parser
    term: parser
    short: The part of the compiler that reads tokens, checks them against the grammar and builds a syntax tree.
    definition: >-
      The part of the compiler that reads tokens, checks that they follow the
      grammar, and builds a syntax tree. It reports syntax errors and recovers
      so it can keep checking the rest of the file.
    spec_ref: specification/grammar.md
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [token-stream, grammar]
    used_in:
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
      - compiler/parser-design.md
      - compiler/ast-guide.md
    recall_question: Which part of the compiler reads the tokens, checks them against the grammar and builds a syntax tree?
    recall_answer: The parser. It reports a syntax error when the tokens do not fit the grammar.

  - id: parsing
    term: parsing
    short: Checking the grammatical structure of a token stream and building the AST.
    definition: >-
      The work of checking the grammatical structure of a token stream and
      building the syntax tree; the parser's job.
    spec: Checking the grammatical structure of a token stream and building the AST.
    spec_ref: specification/glossary.md
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [parser, abstract-syntax-tree]
    used_in:
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/parser-design.md
    recall_question: What does the specification call checking the grammatical structure of a token stream and building the AST?
    recall_answer: Parsing, the job of the parser.

  - id: grammar
    term: grammar
    short: The written rules for which token sequences form valid programs.
    definition: >-
      The written rules for which token sequences form valid programs. Vortex's
      grammar is the formal grammar chapter of the specification, which defines
      the exact v0.1 source syntax.
    spec: >-
      The formal rules describing which token sequences form valid source
      constructs. See the [formal grammar](grammar.md).
    spec_ref: specification/grammar.md
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [token]
    used_in:
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-11-release.md
      - compiler/parser-design.md
      - compiler/ast-guide.md
      - authorship.md
    recall_question: What do we call the written rules for which token sequences form valid programs?
    recall_answer: The grammar. For Vortex it is the formal grammar chapter of the specification.

  - id: grammar-rule
    term: grammar rule
    aliases: [production]
    short: One entry in the grammar describing the shape of one construct; also called a production.
    definition: >-
      One entry in the grammar, describing the shape of one construct, for
      example that a `while` statement is `while`, then an expression, then a
      block. Also called a production.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [grammar]
    used_in: []
    recall_question: What is one entry in the grammar, describing the shape of one construct, called?
    recall_answer: A rule, also called a production.

  - id: node
    term: node
    short: One item in a tree, standing for one construct.
    definition: >-
      One item in a tree. In a syntax tree each node stands for one construct,
      such as one addition, one `if` statement or one function.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: []
    used_in:
      - compiler/architecture.md
      - compiler/parser-design.md
      - compiler/ast-guide.md
    recall_question: In a syntax tree, what stands for one construct, such as one addition or one `if` statement?
    recall_answer: A node. Literals and names are usually leaf nodes.

  - id: root-child-leaf
    term: root, child, leaf
    short: The top node of a tree, a node directly below another, and a node with no children.
    definition: >-
      The root is the node at the top of a tree. A node directly below another
      is its child. A node with no children is a leaf; literals and names are
      usually leaves.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [node]
    used_in: []
    recall_question: In a tree, what are the top node, a node directly below another, and a node with no children called?
    recall_answer: The root, a child and a leaf. Literals and names are usually leaves.

  - id: parse-tree
    term: parse tree
    aliases: [concrete syntax tree]
    tooltip: true
    short: A tree with a node for every grammar rule the parser used, including punctuation.
    definition: >-
      A tree with one node for every grammar rule the parser used, including
      punctuation. Also called a concrete syntax tree.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [parser, node, grammar-rule]
    used_in: []
    recall_question: Which kind of tree has a node for every grammar rule the parser used, including punctuation?
    recall_answer: A parse tree, also called a concrete syntax tree.

  - id: abstract-syntax-tree
    term: abstract syntax tree
    abbr: AST
    short: A tree that keeps only the meaningful parts of a program and drops punctuation.
    definition: >-
      A tree that keeps only the parts of the program that carry meaning, and
      drops punctuation whose job the tree's shape already shows. When the
      compiler guide says syntax tree, it means this kind.
    spec: >-
      A tree representation that preserves the meaningful structure of parsed
      source without retaining every punctuation token as its own node. See the
      [AST learning guide](../compiler/ast-guide.md).
    spec_ref: specification/glossary.md
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [parser, node]
    used_in:
      - compiler/guide/stage-4-names-and-scopes.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - roadmap.md
      - compiler/architecture.md
      - compiler/parser-design.md
      - compiler/ast-guide.md
    recall_question: Which tree keeps only the meaningful parts of a program and drops punctuation whose job the tree's shape already shows?
    recall_answer: The abstract syntax tree (AST), which the guide simply calls the syntax tree.

  - id: associativity
    term: associativity
    short: Which way operators of equal precedence group; left-associative means a - b - c is (a - b) - c.
    definition: >-
      Which way operators of the same precedence group when they repeat. Most
      Vortex binary operators are left-associative, so `a - b - c` means
      `(a - b) - c`; prefix unary operators group right.
    spec: >-
      The rule that determines grouping when operators at the same precedence
      level repeat. Most binary Vortex operators group left; prefix unary
      operators group right. Equality, comparison and range operators do not
      associate: repeating one without parentheses is a syntax error
      ([why](../decisions/operators.md#d37)).
    spec_ref: specification/expressions.md#52-precedence-and-associativity
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [precedence]
    used_in:
      - compiler/parser-design.md
    recall_question: Does `a - b - c` mean `(a - b) - c` or `a - (b - c)`, and which rule decides?
    recall_answer: Associativity decides. Most Vortex binary operators are left-associative, so it means `(a - b) - c`.

  - id: lookahead
    term: lookahead
    short: Peeking at upcoming tokens without using them up.
    definition: >-
      Peeking at the next token, or the next few, without using it up, so the
      parser can choose which rule applies.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [parser, token]
    used_in: []
    recall_question: What is the parser doing when it peeks at the next token without using it up, to decide which rule applies?
    recall_answer: Using lookahead. It lets the parser choose a rule before committing to it.

  - id: syntax-error
    term: syntax error
    short: A report that the tokens do not match the grammar, such as a missing ; or an unclosed (.
    definition: A report that the tokens do not match the grammar, such as a missing `;` or an unclosed `(`.
    spec_ref: specification/diagnostics.md#syntax-error
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [grammar, diagnostic]
    used_in:
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/parser-design.md
    recall_question: Which kind of diagnostic reports that the tokens do not match the grammar, such as a missing `;`?
    recall_answer: A syntax error. The parser reports it and then tries to recover.

  - id: error-recovery
    term: error recovery
    short: What the parser does after a syntax error so it can keep checking the rest of the file.
    definition: >-
      What the parser does after a syntax error so it can keep checking the
      rest of the file, usually by skipping ahead to a synchronization point.
    spec_ref: specification/diagnostics.md#105-recovery
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [syntax-error, parser]
    used_in: []
    recall_question: What does the parser do after a syntax error so that it can keep checking the rest of the file?
    recall_answer: Error recovery, usually by skipping ahead to a synchronization point such as `;` or `}`.

  - id: synchronization-point
    term: synchronization point
    tooltip: true
    short: A token, such as ; or }, where the parser can safely start again after an error.
    definition: A token where the parser can safely start again after an error, such as `;`, `}` or the next `fn`.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [error-recovery]
    used_in:
      - compiler/parser-design.md
    recall_question: After a syntax error, at which tokens can the parser safely start again?
    recall_answer: At synchronization points, such as `;`, `}` or the next `fn`.

  - id: cascade
    term: cascade
    short: A burst of false errors caused by one real mistake.
    definition: >-
      A burst of false errors caused by one real mistake, because the parser got
      confused about where it was.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [syntax-error]
    used_in: []
    recall_question: What do we call a burst of false errors caused by one real mistake?
    recall_answer: A cascade. It happens when the parser gets confused about where it is.

  - id: recursive-descent
    term: recursive descent
    tooltip: true
    short: A hand-written parser in which each grammar rule becomes one piece that calls the pieces for its sub-rules.
    definition: >-
      A way of writing a parser by hand in which each grammar rule becomes one
      piece of the parser, and rules that contain other rules call those pieces.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [parser, grammar-rule]
    used_in:
      - compiler/parser-design.md
    recall_question: What is the hand-written parsing style in which each grammar rule becomes one piece that calls the pieces for the rules it contains?
    recall_answer: Recursive descent.

  - id: pratt-parsing
    term: Pratt parsing
    tooltip: true
    short: A well-known technique for parsing expressions with many precedence levels, named after Vaughan Pratt.
    definition: >-
      A well-known technique for parsing expressions with many precedence
      levels, named after Vaughan Pratt.
    introduced_in: compiler/guide/stage-3-parser-and-tree.md
    requires: [precedence, parser]
    used_in: []
    recall_question: Which well-known technique, named after Vaughan Pratt, parses expressions with many precedence levels?
    recall_answer: Pratt parsing.

  # ---- Compiler guide 4. Names and scopes ----------------------------------

  - id: use
    term: use
    short: A place where a name appears in order to refer to something already declared.
    definition: >-
      A place in the program where a name appears in order to refer to
      something already declared, such as `width` in `print(width)`.
    introduced_in: compiler/guide/stage-4-names-and-scopes.md
    requires: [declaration, identifier]
    used_in:
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - roadmap.md
      - compiler/parser-design.md
      - compiler/ast-guide.md
    recall_question: In `print(width)`, what is this appearance of `width` called, as opposed to the place where it was declared?
    recall_answer: A use. Name resolution links each use to its declaration.

  - id: visible
    term: visible
    short: A declaration is visible at a point if its name can be used there.
    definition: A declaration is visible at a point in the program if its name can be used there.
    introduced_in: compiler/guide/stage-4-names-and-scopes.md
    requires: [scope]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
    recall_question: What do we say about a declaration whose name can be used at a given point in the program?
    recall_answer: It is visible at that point. Outside its scope it is not.

  - id: lookup
    term: lookup
    short: Searching for the declaration a use refers to, starting in the use's scope and moving outward.
    definition: >-
      Searching for the declaration a use refers to, starting from the scope
      where the use appears and moving outward.
    introduced_in: compiler/guide/stage-4-names-and-scopes.md
    requires: [use, nested-scope]
    used_in: []
    recall_question: How does the compiler find the declaration that a use refers to?
    recall_answer: By lookup, starting in the use's own scope and moving outward.

  - id: symbol-table
    term: symbol table
    tooltip: true
    short: The compiler's record of which names are declared in which scopes and what each refers to.
    definition: >-
      The compiler's record of which names are declared in which scopes, and
      what each one refers to. It is an idea, not a particular data structure.
    introduced_in: compiler/guide/stage-4-names-and-scopes.md
    requires: [scope, declaration]
    used_in:
      - roadmap.md
      - compiler/parser-design.md
      - mlir/m2-reading-mlir.md
    recall_question: What is the compiler's record of which names are declared in which scopes called?
    recall_answer: The symbol table. It is an idea, not a particular data structure.

  - id: namespace
    term: namespace
    short: A separate set of names, such as a struct's field names, that do not clash with other names.
    definition: >-
      A separate set of names. A struct's field names form their own
      namespace, reached through a value of that struct type, and do not clash
      with local variables.
    spec: >-
      A set of names in which each name has one meaning. All top-level functions
      and structs share one namespace, and each struct's field names form a
      separate one. See [Scopes](declarations.md#36-scopes).
    introduced_in: compiler/guide/stage-4-names-and-scopes.md
    requires: [field, scope]
    used_in: []
    recall_question: Why can a struct field named `x` and a local variable named `x` exist together without clashing?
    recall_answer: The field names form their own namespace, reached only through a value of the struct type.

  - id: name-resolution
    term: name resolution
    short: The stage that links each use of a name to its declaration and reports unknown or out-of-scope names.
    definition: >-
      The stage that links each use of a name to its declaration and reports
      unknown, duplicate and out-of-scope names.
    spec: >-
      Connecting each name use to one visible declaration and diagnosing
      unknown, duplicate, shadowing, or out-of-scope names.
    spec_ref: specification/declarations.md#37-name-resolution
    introduced_in: compiler/guide/stage-4-names-and-scopes.md
    requires: [use, declaration, lookup]
    used_in:
      - compiler/guide/stage-5-types-and-rules.md
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/architecture.md
      - compiler/parser-design.md
    recall_question: Which compiler stage links each use of a name to its declaration and reports unknown or duplicate names?
    recall_answer: Name resolution. Its problems are reported as name errors.

  - id: name-error
    term: name error
    short: The diagnostic category for unknown, duplicated or out-of-scope names and unresolved named types.
    definition: >-
      The diagnostic category for a name that is unknown, duplicated in the
      same scope, or used outside its scope, and for a named type that does not
      resolve.
    spec_ref: specification/diagnostics.md#name-error
    introduced_in: compiler/guide/stage-4-names-and-scopes.md
    requires: [name-resolution, category]
    used_in: []
    recall_question: Which diagnostic category covers an unknown name, a duplicate in the same scope, or a named type that does not resolve?
    recall_answer: A name error.

  # ---- Compiler guide 5. Types and language rules --------------------------

  - id: type-checking
    term: type checking
    short: Working out every expression's type and checking that operations, calls, assignments and returns fit.
    definition: >-
      Working out the type of every expression and checking that each
      operation, call, assignment and return uses types that fit together.
    spec: >-
      Determining expression types and validating that operations, calls,
      assignments, and returns use compatible types.
    spec_ref: specification/glossary.md
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [type, expression]
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/architecture.md
      - compiler/parser-design.md
      - compiler/ast-guide.md
    recall_question: Which compiler stage works out the type of every expression and checks that operations, calls and returns fit together?
    recall_answer: Type checking. For example, it rejects `3.0 & 1.0`, because bitwise operators need integers.

  - id: compatible
    term: compatible
    short: Allowed together under the type rules; in v0.1 this means the same type, since nothing converts automatically.
    definition: >-
      Allowed to be used together under the type rules. Vortex v0.1 has no
      automatic conversions, so compatible means the same type once each literal
      has taken its type.
    spec: >-
      Describes two types that are equal after literal typing. Vortex v0.1 has
      no implicit conversions, so wherever a rule requires compatible types they
      must be the same type. See [Type
      equality](types-and-values.md#411-type-equality) and the [decision
      record](../decisions/numbers.md#d30).
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [type]
    used_in:
      - compiler/parser-design.md
    recall_question: In v0.1, what does it take for two types to be compatible?
    recall_answer: Being the same type, because v0.1 has no automatic conversions.

  - id: control-flow-path
    term: control-flow path
    tooltip: true
    short: One possible route through a function body, following one choice at every if, loop and return.
    definition: >-
      One possible route through a function's body, following one choice at
      every `if`, loop and `return`. A non-`void` function must return a value
      on every reachable path.
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [function, statement]
    used_in:
      - optimize/o2-cfg-and-dominance.md
      - optimize/o4-dataflow.md
    recall_question: What do we call one possible route through a function body, following one choice at every `if`, loop and `return`?
    recall_answer: A control-flow path. A non-`void` function must return a value on every reachable one.

  - id: constant-evaluation
    term: constant evaluation
    short: Working out an expression's value during compilation, because the language needs it before the program runs.
    definition: >-
      Working out the value of an expression while compiling, because the
      language needs that value before the program runs. Array dimensions are
      the v0.1 case, so `[f32; 2 + 2]` becomes `[f32; 4]`.
    spec: >-
      Evaluation performed by the compiler before the program runs: of fixed
      array dimensions, and of every checked operation whose deciding operands
      are integer constant expressions, where a failure is a constant-evaluation
      error. See [Expressions 5.12](expressions.md#512-constant-expressions).
    spec_ref: specification/arrays.md#72-dimension-rules
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [compile-time, dimension]
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-11-release.md
      - compiler/architecture.md
      - compiler/parser-design.md
    recall_question: Which compiler step turns `[f32; 2 + 2]` into `[f32; 4]` before the program runs?
    recall_answer: Constant evaluation. Array dimensions are the v0.1 case that needs it.

  - id: static-rule
    term: static rule
    short: A rule the compiler can check by reading the program, before it runs.
    definition: >-
      A rule the compiler can check by reading the program, before it runs.
      Syntax, name visibility, types, mutability and fixed array sizes are
      static rules.
    spec: A rule that a conforming implementation can check before program execution.
    spec_ref: specification/conformance.md#14-static-and-dynamic-rules
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [compile-time]
    used_in:
      - compiler/guide/stage-9-runtime-safety.md
    recall_question: What kind of rule can the compiler check just by reading the program, such as a type or mutability rule?
    recall_answer: A static rule. Breaking one is reported before the program runs.

  - id: dynamic-rule
    term: dynamic rule
    short: A rule that depends on values known only while the program runs.
    definition: >-
      A rule that depends on values known only while the program runs, such as
      whether an index is inside its array or a divisor is zero. It needs a
      runtime check unless the compiler can prove the answer.
    spec: A requirement involving values that may only be known during execution.
    spec_ref: specification/conformance.md#14-static-and-dynamic-rules
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [run-time, static-rule]
    used_in:
      - compiler/guide/stage-9-runtime-safety.md
    recall_question: What kind of rule, such as an index being inside its array, depends on values known only while the program runs?
    recall_answer: A dynamic rule. Unless the compiler can prove the answer, it keeps a runtime check for it.

  - id: well-formed
    term: well-formed
    short: Satisfying every applicable v0.1 rule; a conforming compiler must accept a well-formed program.
    definition: >-
      Satisfying every applicable v0.1 rule. A conforming implementation must
      accept every well-formed program within its documented implementation
      limits.
    spec: Describes a program that satisfies every applicable v0.1 rule.
    spec_ref: specification/conformance.md#12-programs
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [static-rule]
    used_in: []
    recall_question: What do we call a program that satisfies every applicable v0.1 rule?
    recall_answer: Well-formed. A conforming compiler must accept it, within its documented limits.

  - id: ill-formed
    term: ill-formed
    short: Breaking at least one required language rule; an ill-formed program must be rejected.
    definition: >-
      Breaking at least one required language rule. An ill-formed program must
      be rejected rather than silently given some other meaning.
    spec: Describes source that violates at least one required language rule and must be rejected.
    spec_ref: specification/conformance.md#13-implementation-conformance
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [well-formed]
    used_in: []
    recall_question: What is source that breaks at least one required language rule called, and what must the compiler do with it?
    recall_answer: Ill-formed. The compiler must reject it.

  - id: negative-test
    term: negative test
    tooltip: true
    short: A test that passes only if the compiler rejects a bad program for the right reason at the right place.
    definition: >-
      A test that feeds the compiler a program that should be rejected, and
      passes only if the compiler rejects it for the right reason at the right
      place.
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [invalid-program, diagnostic]
    used_in:
      - roadmap.md
    recall_question: Which kind of test passes only if the compiler rejects a bad program for the right reason at the right place?
    recall_answer: A negative test.

  - id: semantic-analysis
    term: semantic analysis
    tooltip: true
    short: Static checks that need context beyond the grammar, such as mutability, loop-only statements and main.
    definition: >-
      Static checks that need context beyond the grammar, such as whether an
      assignment target is mutable, whether `break` is inside a loop, and
      whether the program has a valid `main`.
    spec: >-
      Static checks that require context beyond grammar, including mutability,
      control-flow placement, and entry-point validation.
    spec_ref: specification/diagnostics.md#semantic-error
    introduced_in: compiler/guide/stage-5-types-and-rules.md
    requires: [static-rule, grammar]
    used_in:
      - compiler/parser-design.md
    recall_question: Which checks run after parsing to enforce rules that need context, such as `break` appearing only inside a loop?
    recall_answer: Semantic analysis. It covers mutability, control-flow placement and entry-point validation.

  # ---- Compiler guide 6. The first machine code ----------------------------

  - id: intermediate-representation
    term: intermediate representation
    abbr: IR
    short: The program written inside the compiler in a form that is no longer source text but not yet machine code.
    definition: >-
      A way of writing the program down inside the compiler that is no longer
      Vortex source and not yet machine code. It sits between the front end and
      the back end.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [machine-code, front-end]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/parser-design.md
      - backend/b1-simplest-backend.md
      - backend/c1-instruction-selection.md
      - optimize/o1-optimizer-contract.md
      - gpu/g7-programming-models.md
      - gpu/g8-isas-and-irs.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - gpu/g13-tile-languages.md
      - mlir/m1-why-mlir.md
    recall_question: What do we call the form of the program inside the compiler that is no longer source text but not yet machine code?
    recall_answer: The intermediate representation (IR). It sits between the front end and the back end.

  - id: lowering
    term: lowering
    short: Rewriting a program in a simpler, more machine-like form, such as a syntax tree into an IR.
    definition: >-
      Rewriting a program in a lower-level form, for example from the checked
      syntax tree into an IR, or from an IR into something closer to the
      machine.
    spec: >-
      Translating a validated representation into a lower-level intermediate or
      target representation.
    spec_ref: specification/glossary.md
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [intermediate-representation, abstract-syntax-tree]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-11-release.md
      - compiler/architecture.md
      - gpu/g8-isas-and-irs.md
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: What is it called when the compiler rewrites the checked syntax tree as a list of small, ordered steps?
    recall_answer: Lowering. It moves the program toward a more machine-like form, such as an IR.

  - id: front-end
    term: front end
    short: The first half of a compiler, which reads the source, works out its meaning and rejects bad programs.
    definition: >-
      The first half of a compiler, which reads the source code, works out its
      structure and meaning, and rejects programs that break the rules. In this
      guide it is stages 1 to 5.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [compiler]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - mlir/m12-vortex-gpu-path.md
    recall_question: Which half of the compiler reads the source, works out what it means and rejects bad programs?
    recall_answer: The front end. In this guide it is stages 1 to 5.

  - id: back-end
    term: back end
    short: The second half of a compiler, which turns a checked program into code for a particular machine.
    definition: >-
      The second half of a compiler, which turns a checked program into code
      for a particular kind of machine. Supporting another target, such as a
      GPU, would need another back end but the same front end.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [front-end, machine-code]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - gpu/g8-isas-and-irs.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - gpu/g13-tile-languages.md
      - mlir/m12-vortex-gpu-path.md
    recall_question: Which half of the compiler turns a checked program into code for a particular machine?
    recall_answer: The back end. Another kind of machine, such as a GPU, would need another back end but the same front end.

  - id: target
    term: target
    short: The kind of machine and operating system the generated program is meant to run on.
    definition: The kind of machine and operating system the generated program is meant to run on.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: []
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/architecture.md
      - compiler/parser-design.md
      - backend/a1-machine-model.md
      - backend/b2-x86-64.md
      - backend/e2-describing-a-target.md
      - gpu/g7-programming-models.md
      - gpu/g8-isas-and-irs.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - gpu/g11-matrix-units.md
    recall_question: What do we call the kind of machine and operating system a generated program is meant to run on?
    recall_answer: The target. The back end produces code for it.

  - id: instruction
    term: instruction
    short: One basic operation a processor can carry out, such as adding two numbers.
    definition: >-
      One basic operation a processor can carry out, such as adding two numbers
      or jumping to another place in the code.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [machine-code]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-9-runtime-safety.md
      - backend/a1-machine-model.md
      - backend/b1-simplest-backend.md
      - backend/b3-object-files.md
      - backend/d2-jit.md
      - backend/e3-llvm-allocator-scheduler-mc.md
      - gpu/g2-simt.md
      - gpu/g8-isas-and-irs.md
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: What is one basic operation a processor can carry out, such as adding two numbers, called?
    recall_answer: An instruction. Machine code is a sequence of instructions in numeric form.

  - id: register
    term: register
    short: A small, very fast storage slot inside the processor.
    definition: >-
      A small, very fast storage slot inside the processor. Instructions mostly
      work on values held in registers.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [instruction]
    used_in:
      - backend/a1-machine-model.md
      - backend/a2-aarch64-assembly.md
      - backend/a4-calling-conventions.md
      - backend/c3-linear-scan.md
      - optimize/o3-ssa.md
      - optimize/p5-microarchitecture.md
      - gpu/g3-memory-hierarchy.md
      - gpu/g5-occupancy.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - gpu/g10-matmul-ladder.md
      - gpu/g11-matrix-units.md
    recall_question: What are the small, very fast storage slots inside the processor called?
    recall_answer: Registers. Instructions mostly work on values held in them.

  - id: assembly-language
    term: assembly language
    short: A readable text form of machine instructions, one per line; an assembler turns it into machine code.
    definition: >-
      A text form of machine instructions, one instruction per line, readable
      by people. An assembler turns it into machine code.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [instruction, machine-code]
    used_in:
      - backend/a2-aarch64-assembly.md
      - backend/b1-simplest-backend.md
      - backend/b2-x86-64.md
    recall_question: What is the readable text form of machine instructions, which an assembler turns into machine code?
    recall_answer: Assembly language.

  - id: object-file
    term: object file
    tooltip: true
    short: Machine code that is not yet a complete program and may refer to code elsewhere, such as print.
    definition: >-
      A file of machine code that is not yet a complete program. It may use
      names, such as `print`, whose code lives somewhere else.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [machine-code]
    used_in:
      - roadmap.md
      - backend/b3-object-files.md
      - backend/b4-linking-and-loading.md
      - backend/d1-debug-info.md
      - backend/d2-jit.md
    recall_question: What do we call a file of machine code that is not yet a complete program and may refer to code elsewhere, such as `print`?
    recall_answer: An object file. A linker joins object files and libraries into an executable.

  - id: linker
    term: linker
    short: A tool that joins object files and libraries, such as the runtime, into one executable.
    definition: >-
      The tool that joins object files and libraries into one executable,
      filling in each name with the address of the code it refers to.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [object-file, executable]
    used_in:
      - backend/b3-object-files.md
      - backend/b4-linking-and-loading.md
      - backend/d2-jit.md
    recall_question: Which tool joins object files and the runtime library into one executable?
    recall_answer: The linker. It fills in each name with the address of the code it refers to.

  - id: executable
    term: executable
    short: A file of machine code that the operating system can start as a program.
    definition: A file of machine code that the operating system can start as a program.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [machine-code]
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
      - backend/b4-linking-and-loading.md
      - backend/d2-jit.md
    recall_question: What do we call a file of machine code that the operating system can start as a program?
    recall_answer: An executable. The linker produces it from object files and libraries.

  - id: runtime-library
    term: runtime library
    short: A small body of code shipped with the language that generated programs call for services such as printing.
    definition: >-
      A small body of code, supplied with the language rather than written by
      the programmer, that generated programs call for services such as
      printing and error reporting. The guide also calls it the runtime.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [executable]
    used_in:
      - compiler/guide/stage-9-runtime-safety.md
      - backend/b1-simplest-backend.md
      - backend/b4-linking-and-loading.md
    recall_question: Where does the code for `print` come from in a compiled Vortex program?
    recall_answer: From the runtime library, code supplied with the language that generated programs call for services such as printing.

  - id: standard-output
    term: standard output
    short: The text stream a program writes to by default, which tests can capture.
    definition: >-
      The text stream a program writes to by default, usually shown in the
      terminal. Tests capture it to compare with the expected output.
    spec: >-
      The output stream for a program's normal results. `print` writes there.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [expected-output]
    used_in: []
    recall_question: Which text stream does a program write to by default, and which tests capture to compare with the expected output?
    recall_answer: Standard output.

  - id: static-single-assignment
    term: static single assignment form
    abbr: SSA
    aliases: [static single assignment]
    short: A way of writing a program in which every variable is assigned exactly once.
    definition: >-
      A style of IR in which every named value is assigned exactly once. A
      variable that changes becomes a series of separately named versions,
      which makes many later analyses simpler.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [intermediate-representation]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - backend/c2-liveness.md
      - backend/c4-graph-coloring.md
      - backend/e1-llvm-codegen-pipeline.md
      - optimize/o3-ssa.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - mlir/m1-why-mlir.md
      - mlir/m2-reading-mlir.md
      - mlir/m9-transform-dialect.md
    recall_question: In which style of IR is every named value assigned exactly once, so that a changing variable becomes a series of versions?
    recall_answer: Static single assignment (SSA) form.

  - id: phi
    term: phi
    short: In SSA form, a marker at the point where paths meet that picks which version of a value to use.
    definition: >-
      In SSA form, a marker at a point where two paths meet that picks which
      version of a value to use, depending on which path was taken.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [static-single-assignment]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - backend/e1-llvm-codegen-pipeline.md
      - optimize/o2-cfg-and-dominance.md
      - optimize/o3-ssa.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - mlir/m2-reading-mlir.md
      - mlir/m4-dialect-conversion.md
    recall_question: In SSA form, what picks which version of a value to use at a point where two paths meet?
    recall_answer: A phi. Its choice depends on which path was taken.

  - id: pass
    term: pass
    short: One trip through the whole program by one part of the compiler, doing one job.
    definition: >-
      One trip over the whole program that does one job, such as checking types
      or lowering to IR, reading one representation and producing another or a
      list of problems.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [compiler]
    used_in:
      - compiler/guide/stage-7-functions-and-control-flow.md
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - compiler/architecture.md
      - backend/c6-scheduling.md
      - backend/d3-real-backends.md
      - backend/e1-llvm-codegen-pipeline.md
      - optimize/o1-optimizer-contract.md
      - optimize/o10-pass-pipelines.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - gpu/g13-tile-languages.md
      - mlir/m1-why-mlir.md
      - mlir/m3-passes-and-rewriting.md
      - mlir/m4-dialect-conversion.md
    recall_question: What do we call one trip over the whole program by one part of the compiler, doing one job?
    recall_answer: A pass, such as checking types or lowering to IR.

  - id: toolchain
    term: toolchain
    short: The outside programs the compiler depends on, such as an assembler, a linker or a C compiler.
    definition: >-
      The set of outside programs the compiler depends on to finish its work,
      such as an assembler, a linker or a C compiler.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [linker, assembly-language]
    used_in:
      - backend/b1-simplest-backend.md
      - backend/b2-x86-64.md
      - backend/b4-linking-and-loading.md
    recall_question: What do we call the outside programs, such as an assembler and a linker, that the compiler depends on?
    recall_answer: The toolchain.

  - id: nanopass
    term: nanopass
    short: A style of compiler design that uses many very small passes, each doing one job.
    definition: >-
      A style of compiler design that uses many very small passes, each of
      which performs a single task. The nanopass papers are worth reading
      before you design lowering.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [pass]
    used_in: []
    recall_question: Which style of compiler design uses many very small passes, each performing a single task?
    recall_answer: Nanopass.

  - id: bytecode
    term: bytecode
    short: Simple instructions meant to be run by a program called a virtual machine, not directly by the processor.
    definition: >-
      A compact list of simple instructions meant to be run by another program,
      a virtual machine, rather than directly by the processor. The second half
      of Crafting Interpreters compiles to bytecode; Vortex compiles to machine
      code.
    introduced_in: compiler/guide/stage-6-first-machine-code.md
    requires: [instruction, machine-code]
    used_in: []
    recall_question: What do we call simple instructions that are run by a virtual machine rather than directly by the processor?
    recall_answer: Bytecode. Vortex compiles to machine code instead.

  # ---- Compiler guide 7. Functions and control flow ------------------------

  - id: caller
    term: caller
    short: The function that makes a call.
    definition: >-
      The function that makes a call. When the called function finishes,
      execution carries on in the caller just after the call.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [function-call]
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/ast-guide.md
      - backend/a4-calling-conventions.md
      - backend/a5-stack-frames.md
    recall_question: In a function call, what is the function that makes the call named?
    recall_answer: The caller. The function being called is the callee.

  - id: callee
    term: callee
    short: The function being called.
    definition: >-
      The function being called. It runs its body with the arguments it was
      given and hands any return value back to the caller.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [function-call, caller]
    used_in:
      - compiler/guide/stage-8-data-in-memory.md
      - compiler/parser-design.md
      - backend/a4-calling-conventions.md
      - backend/a5-stack-frames.md
    recall_question: In a function call, what is the function being called named?
    recall_answer: The callee. It hands its return value back to the caller.

  - id: return-value
    term: return value
    short: The value a function hands back to its caller; a void function has none.
    definition: The value a function hands back to its caller. A `void` function has none.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [function, caller]
    used_in:
      - roadmap.md
      - backend/a4-calling-conventions.md
    recall_question: What is the value a function hands back to its caller called, and which functions have none?
    recall_answer: The return value. A `void` function has none.

  - id: call-stack
    term: call stack
    short: The record of calls that have started and not yet finished; each call adds an entry on top.
    definition: >-
      The record of calls that have started and not yet finished. Each new call
      goes on top, and each return removes the top entry.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [function-call]
    used_in:
      - backend/a5-stack-frames.md
      - backend/d1-debug-info.md
    recall_question: What records the calls that have started but not yet finished, adding one on each call and removing one on each return?
    recall_answer: The call stack.

  - id: stack-frame
    term: stack frame
    tooltip: true
    short: One call's entry on the call stack, holding its parameters, local variables and where to return to.
    definition: >-
      One entry on the call stack. It holds what a single call needs while it
      runs, namely its parameters, its local variables and where to go back to.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [call-stack, parameter, local-variable]
    used_in:
      - backend/a4-calling-conventions.md
      - backend/a5-stack-frames.md
      - backend/c5-spilling.md
      - backend/d1-debug-info.md
      - backend/e3-llvm-allocator-scheduler-mc.md
    recall_question: What is one call's entry on the call stack, holding its parameters, local variables and return place, called?
    recall_answer: A stack frame.

  - id: calling-convention
    term: calling convention
    tooltip: true
    short: The agreement between caller and callee about where arguments and the return value go.
    definition: >-
      The agreement between caller and callee about where arguments are placed
      and where the return value is found.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [caller, callee, argument, return-value]
    used_in:
      - backend/a4-calling-conventions.md
      - backend/e2-describing-a-target.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - mlir/m4-dialect-conversion.md
      - mlir/m12-vortex-gpu-path.md
    recall_question: Which agreement between caller and callee says where arguments are placed and where the return value is found?
    recall_answer: The calling convention.

  - id: basic-block
    term: basic block
    tooltip: true
    short: A straight run of instructions entered only at the top and left only at the bottom.
    definition: >-
      A straight run of instructions with one way in, at the top, and one way
      out, at the bottom. Nothing jumps into the middle of it.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [instruction]
    used_in:
      - backend/c1-instruction-selection.md
      - backend/c2-liveness.md
      - backend/c6-scheduling.md
      - optimize/o2-cfg-and-dominance.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - mlir/m2-reading-mlir.md
    recall_question: What is a straight run of instructions with one way in at the top and one way out at the bottom called?
    recall_answer: A basic block. Nothing jumps into the middle of it.

  - id: control-flow-graph
    term: control-flow graph
    abbr: CFG
    short: A function drawn as basic blocks joined by arrows that show where execution can go next.
    definition: >-
      A picture of a function as basic blocks joined by arrows, where each
      arrow shows a place execution can go next.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [basic-block]
    used_in:
      - backend/c2-liveness.md
      - backend/c4-graph-coloring.md
      - optimize/o2-cfg-and-dominance.md
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: Which picture of a function shows basic blocks joined by arrows for where execution can go next?
    recall_answer: The control-flow graph (CFG).

  - id: edge
    term: edge
    short: One arrow in a control-flow graph.
    definition: One arrow in a control-flow graph, showing one place execution can go next.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [control-flow-graph]
    used_in:
      - compiler/guide/stage-9-runtime-safety.md
    recall_question: What is one arrow in a control-flow graph called?
    recall_answer: An edge. It shows one place execution can go next.

  - id: branch
    term: branch
    aliases: [jump, conditional branch]
    short: An instruction that moves execution to another block; conditional on a bool, or an unconditional jump.
    definition: >-
      An instruction that moves execution to another block. A conditional
      branch chooses between two blocks based on a `bool`; an unconditional
      branch, often called a jump, always goes to the same one.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [basic-block]
    used_in:
      - gpu/g2-simt.md
      - gpu/g6-synchronization.md
      - gpu/g8-isas-and-irs.md
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: Which instruction moves execution to another block, and what is its unconditional kind often called?
    recall_answer: A branch. A conditional branch picks between two blocks using a `bool`; an unconditional one is a jump.

  - id: back-edge
    term: back edge
    tooltip: true
    short: An edge that leads back to an earlier block, which is what makes a loop.
    definition: An edge that goes back to an earlier block, which is what makes a loop.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [edge]
    used_in:
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: In a control-flow graph, what kind of edge makes a loop?
    recall_answer: A back edge, one that goes back to an earlier block.

  - id: join-point
    term: join point
    tooltip: true
    short: A block that two or more paths lead into, such as the code after an if and else.
    definition: A block that two or more paths lead into, such as the code after an `if ... else`.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [basic-block, edge]
    used_in: []
    recall_question: What do we call the block that two or more paths lead into, such as the code after an `if ... else`?
    recall_answer: A join point.

  - id: early-return
    term: early return
    short: A return that ends a function before its last statement.
    definition: >-
      A `return` that ends the function before its last statement, such as
      `return;` inside an `if` in a `void` function.
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [function, statement]
    used_in: []
    recall_question: What do we call a `return` that ends a function before its last statement?
    recall_answer: An early return.

  - id: lifetime
    term: lifetime
    short: How long a variable exists while the program runs, as opposed to where its name is visible.
    definition: >-
      How long a variable or value exists while the program runs. A local
      variable exists from its declaration until execution leaves its block;
      that is distinct from its scope, which is where its name is visible.
    spec: >-
      The interval during which a value or storage location exists and may be
      accessed safely.
    spec_ref: specification/statements.md#611-scope-and-lifetime
    introduced_in: compiler/guide/stage-7-functions-and-control-flow.md
    requires: [local-variable, scope]
    used_in:
      - backend/c2-liveness.md
      - backend/c5-spilling.md
    recall_question: Scope says where a variable's name is visible; what says how long the variable itself exists while the program runs?
    recall_answer: Its lifetime. A local variable exists from its declaration until execution leaves its block.

  # ---- Compiler guide 8. Data in memory ------------------------------------

  - id: memory
    term: memory
    short: The large, numbered storage area a running program reads and writes.
    definition: >-
      The large, numbered storage area a running program reads and writes.
      Think of it as one very long row of small boxes, each one a byte.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [byte]
    used_in:
      - compiler/guide/stage-11-release.md
      - backend/a1-machine-model.md
      - backend/b3-object-files.md
      - optimize/p2-memory-hierarchy.md
    recall_question: What is the large, numbered storage area a running program reads and writes called?
    recall_answer: Memory, one very long row of bytes, each with its own number.

  - id: address
    term: address
    short: The number of a byte in memory, used to say where a value starts.
    definition: The number of a byte in memory. A value's address is the number of its first byte.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [memory, byte]
    used_in:
      - compiler/ast-guide.md
      - backend/a1-machine-model.md
      - backend/a2-aarch64-assembly.md
      - optimize/p2-memory-hierarchy.md
      - gpu/g3-memory-hierarchy.md
      - gpu/g4-memory-performance.md
      - gpu/g9-gpu-compilers-in-llvm.md
    recall_question: What is the number of a byte in memory called, and which byte gives a value its one?
    recall_answer: An address. A value's address is the number of its first byte.

  - id: size
    term: size
    short: How many bytes a value takes up.
    definition: How many bytes a value takes up. An `f32` is 32 bits, so it fills four bytes.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [byte]
    used_in:
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-10-matrix-multiplication.md
    recall_question: What do we call how many bytes a value takes up, and what is it for an `f32`?
    recall_answer: Its size. An `f32` takes four bytes.

  - id: alignment
    term: alignment
    short: A rule that a value must start at an address that is a multiple of some number.
    definition: >-
      A rule that a value must start at an address that is a multiple of some
      number, often its own size. Many processors read a four-byte number
      faster, or only correctly, when it starts at a multiple of four.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [address, size]
    used_in:
      - backend/a5-stack-frames.md
      - backend/b3-object-files.md
      - gpu/g4-memory-performance.md
    recall_question: Which rule says a value must start at an address that is a multiple of some number?
    recall_answer: Alignment. A four-byte number, for example, is best started at a multiple of four.

  - id: padding
    term: padding
    short: Unused bytes placed between or after the parts of a value so each part meets its alignment rule.
    definition: >-
      Unused bytes placed between or after the parts of a value so that each
      part meets its alignment rule.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [alignment]
    used_in:
      - gpu/g4-memory-performance.md
      - gpu/g13-tile-languages.md
      - gpu/g15-systolic-arrays.md
    recall_question: What are the unused bytes placed between or after a value's parts, so each part meets its alignment rule, called?
    recall_answer: Padding.

  - id: layout-offset
    term: offset (within a value)
    short: The distance in bytes from the start of a value to one of its parts.
    definition: >-
      The distance, in bytes, from the start of a value to one of its parts,
      such as a struct field or an array element.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [byte]
    used_in: []
    recall_question: In a value's layout, what is the distance in bytes from the start of the value to one of its parts called?
    recall_answer: An offset. Each field or element of a value sits at its own offset.

  - id: layout
    term: layout
    short: The full description of a value's size, alignment and the offset of every element or field.
    definition: >-
      The complete description of where each part of a value sits, namely its
      size, its alignment and the offset of every element or field.
    spec_ref: specification/structs.md#88-layout
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [size, alignment, layout-offset]
    used_in:
      - compiler/guide/stage-10-matrix-multiplication.md
      - compiler/guide/stage-11-release.md
      - gpu/g4-memory-performance.md
      - gpu/g9-gpu-compilers-in-llvm.md
      - gpu/g11-matrix-units.md
      - gpu/g13-tile-languages.md
    recall_question: What is the full description of a value's size, alignment and the offset of each of its parts called?
    recall_answer: Its layout.

  - id: contiguous
    term: contiguous
    short: Stored side by side with no gaps.
    definition: >-
      Stored side by side with no gaps. The specification says arrays are
      intended to use contiguous, predictable storage.
    spec_ref: specification/arrays.md#78-memory-and-layout
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [memory]
    used_in:
      - gpu/g4-memory-performance.md
      - gpu/g10-matmul-ladder.md
    recall_question: What do we call values stored side by side in memory with no gaps?
    recall_answer: Contiguous. Arrays are intended to use contiguous, predictable storage.

  - id: aggregate
    term: aggregate
    aliases: [aggregate type]
    short: A value made of other values; in v0.1, arrays and structs.
    definition: A value made of other values. In Vortex v0.1 the aggregates are arrays and structs.
    spec: >-
      A type composed of subordinate values. Vortex v0.1 aggregate types are
      fixed arrays and structs.
    spec_ref: specification/glossary.md
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [array, struct]
    used_in:
      - optimize/o7-inlining-and-sroa.md
    recall_question: What do we call a value made of other values, and which v0.1 types are like that?
    recall_answer: An aggregate. In v0.1 the aggregates are arrays and structs.

  - id: row-major-order
    term: row-major order
    tooltip: true
    short: Storing a two-dimensional array one whole row after another.
    definition: >-
      Storing a two-dimensional array one whole row after another, so that
      neighbours in a row are neighbours in memory.
    spec: >-
      The array layout in which the last index varies fastest: a `[T; 2, 2]` is
      stored as `[0, 0]`, `[0, 1]`, `[1, 0]`, `[1, 1]`. Every v0.1 array uses
      it. See [Arrays and shapes](arrays.md#78-memory-and-layout).
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [contiguous, dimension]
    used_in:
      - gpu/g1-throughput-machines.md
      - gpu/g3-memory-hierarchy.md
      - gpu/g4-memory-performance.md
      - gpu/g7-programming-models.md
      - gpu/g11-matrix-units.md
      - mlir/m2-reading-mlir.md
      - mlir/m6-affine-and-scf.md
    recall_question: What do we call storing a two-dimensional array one whole row after another?
    recall_answer: Row-major order. Neighbours in a row are then neighbours in memory.

  - id: column-major-order
    term: column-major order
    tooltip: true
    short: Storing a two-dimensional array one whole column after another.
    definition: >-
      Storing a two-dimensional array one whole column after another, so that
      neighbours in a column are neighbours in memory.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [row-major-order]
    used_in:
      - gpu/g4-memory-performance.md
      - gpu/g13-tile-languages.md
    recall_question: What do we call storing a two-dimensional array one whole column after another?
    recall_answer: Column-major order. Neighbours in a column are then neighbours in memory.

  - id: application-binary-interface
    term: application binary interface
    abbr: ABI
    short: The low-level agreement about how values are laid out and passed between functions in machine code.
    definition: >-
      The low-level agreement about how values are laid out and passed between
      functions in machine code.
    introduced_in: compiler/guide/stage-8-data-in-memory.md
    requires: [layout, calling-convention]
    used_in:
      - backend/a4-calling-conventions.md
      - backend/a5-stack-frames.md
      - backend/e2-describing-a-target.md
    recall_question: What is the low-level agreement about how values are laid out and passed between functions in machine code?
    recall_answer: The application binary interface (ABI).

  # ---- Compiler guide 9. Runtime safety ------------------------------------

  - id: integer-overflow
    term: integer overflow
    short: An integer calculation whose true answer does not fit in its type.
    definition: >-
      An integer calculation whose true answer does not fit in its type; for
      `i32`, anything above 2,147,483,647 or below -2,147,483,648. In Vortex
      v0.1 it is an error, never silently wrapped.
    spec_ref: specification/diagnostics.md#runtime-error
    introduced_in: compiler/guide/stage-9-runtime-safety.md
    requires: [primitive-type, runtime-error]
    used_in:
      - roadmap.md
    recall_question: What is it called when an `i32` calculation's true answer does not fit in 32 bits, and what does v0.1 do about it?
    recall_answer: Integer overflow. Vortex v0.1 reports it as an error and never silently wraps or saturates the value.

  - id: wrapping
    term: wrapping
    short: Handling overflow by silently dropping the high bits; v0.1 does not do this.
    definition: >-
      Handling overflow by silently throwing away the high bits, so a number
      that is too big comes back as a small or negative one. Vortex v0.1 does
      not do this.
    introduced_in: compiler/guide/stage-9-runtime-safety.md
    requires: [integer-overflow]
    used_in: []
    recall_question: What is it called when overflow is handled by silently dropping the high bits, and does v0.1 do it?
    recall_answer: Wrapping. Vortex v0.1 does not do it.

  - id: saturating
    term: saturating
    short: Handling overflow by clamping to the largest or smallest value; v0.1 does not do this.
    definition: >-
      Handling overflow by clamping to the largest or smallest value the type
      can hold. Vortex v0.1 does not do this either.
    introduced_in: compiler/guide/stage-9-runtime-safety.md
    requires: [integer-overflow]
    used_in: []
    recall_question: What is it called when overflow is handled by clamping to the largest or smallest value, and does v0.1 do it?
    recall_answer: Saturating. Vortex v0.1 does not do it.

  - id: undefined-behavior
    term: undefined behavior
    tooltip: true
    short: A situation where the rules say nothing about what happens next.
    definition: >-
      A situation where the rules of a language or machine say nothing at all
      about what happens next; the program may crash, give a wrong answer or
      appear to work. Vortex v0.1 does not intentionally expose it to
      well-formed programs.
    spec: >-
      Behavior for which a language imposes no requirements. Vortex v0.1 does
      not intentionally expose undefined behavior to well-formed safe programs.
    spec_ref: specification/conformance.md#15-undefined-behavior
    introduced_in: compiler/guide/stage-9-runtime-safety.md
    requires: [dynamic-rule, well-formed]
    used_in:
      - backend/c7-peephole.md
      - backend/e4-testing-backends.md
      - optimize/o1-optimizer-contract.md
      - optimize/o11-undefined-behavior.md
      - gpu/g4-memory-performance.md
      - gpu/g13-tile-languages.md
    recall_question: What do we call a situation where the rules say nothing about what happens next, and can a well-formed v0.1 program reach it?
    recall_answer: Undefined behavior. Vortex v0.1 does not intentionally expose it to well-formed programs.

  - id: proven-safe
    term: proven safe
    short: Known by the compiler, from the source alone, to be unable to fail.
    definition: >-
      Known by the compiler, from the source alone, to be unable to fail. Only
      such a proof allows a runtime check to be left out.
    introduced_in: compiler/guide/stage-9-runtime-safety.md
    requires: [runtime-check]
    used_in: []
    recall_question: When may the compiler leave out a runtime check?
    recall_answer: Only when the operation is proven safe, known from the source alone to be unable to fail.

  - id: ieee-754
    term: IEEE 754
    abbr: IEEE 754
    short: The international standard for floating-point arithmetic, which f32 and f64 follow.
    definition: >-
      The international standard for floating-point arithmetic. Vortex's `f32`
      and `f64` follow it, and v0.1 does not reorder floating-point operations
      in ways that change their results.
    spec_ref: specification/types-and-values.md#44-floating-point-values
    introduced_in: language-tour/06-runtime-and-numerical-rules.md
    requires: []
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-9-runtime-safety.md
