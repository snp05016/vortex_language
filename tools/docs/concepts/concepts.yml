      - mlir/m11-ml-compilers.md
      - mlir/m12-vortex-gpu-path.md
    recall_question: Which international standard do Vortex's `f32` and `f64` follow?
    recall_answer: IEEE 754, the standard for floating-point arithmetic.

  - id: nan
    term: NaN
    abbr: NaN
    short: Not a number; a special floating-point value produced by operations such as 0.0 / 0.0.
    definition: >-
      Short for not a number. A special IEEE 754 value produced by operations
      such as zero divided by zero.
    introduced_in: language-tour/06-runtime-and-numerical-rules.md
    requires: [ieee-754]
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-9-runtime-safety.md
      - compiler/guide/stage-11-release.md
    recall_question: Which special floating-point value does `0.0 / 0.0` produce?
    recall_answer: NaN, short for not a number.

  - id: infinity
    term: infinity
    short: A special floating-point value produced, for example, by dividing a nonzero number by zero.
    definition: A special IEEE 754 value produced, for example, by dividing a nonzero number by zero.
    introduced_in: language-tour/06-runtime-and-numerical-rules.md
    requires: [ieee-754]
    used_in:
      - compiler/guide/stage-6-first-machine-code.md
      - compiler/guide/stage-9-runtime-safety.md
    recall_question: Which special floating-point value does dividing a nonzero number by zero produce?
    recall_answer: Infinity, a special IEEE 754 value.

  - id: boundary-case
    term: boundary case
    short: The value at the edge, the last one that works and the first one that fails.
    definition: >-
      The value right at the edge, the last one that works and the first one
      that fails, such as the last index of a dimension and one past it.
    introduced_in: compiler/guide/stage-9-runtime-safety.md
    requires: [test-case]
    used_in:
      - roadmap.md
    recall_question: When testing a runtime check, what do we call the values right at the edge, the last that works and the first that fails?
    recall_answer: Boundary cases, such as the last valid index and one past it.

  # ---- Compiler guide 10. Matrix multiplication ----------------------------

  - id: matrix
    term: matrix
    short: A rectangle of numbers in rows and columns; in v0.1, a two-dimensional array.
    definition: >-
      A rectangle of numbers arranged in rows and columns. In Vortex v0.1 a
      matrix is simply a two-dimensional array such as `[f32; 2, 3]`.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [array, rank]
    used_in:
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - gpu/g4-memory-performance.md
      - gpu/g10-matmul-ladder.md
      - gpu/g11-matrix-units.md
      - gpu/g12-flashattention.md
      - gpu/g13-tile-languages.md
      - gpu/g15-systolic-arrays.md
    recall_question: What is a rectangle of numbers in rows and columns called, and how is it written in v0.1?
    recall_answer: A matrix. In v0.1 it is simply a two-dimensional array such as `[f32; 2, 3]`.

  - id: row-and-column
    term: row, column
    short: One horizontal line of a matrix, and one vertical line.
    definition: >-
      A row is one horizontal line of a matrix and a column is one vertical
      line. A 2 by 3 matrix has 2 rows and 3 columns.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [matrix]
    used_in:
      - gpu/g4-memory-performance.md
      - gpu/g10-matmul-ladder.md
    recall_question: In a matrix, what are one horizontal line and one vertical line called, and how many of each does a 2 by 3 matrix have?
    recall_answer: A row and a column. A 2 by 3 matrix has 2 rows and 3 columns.

  - id: square-matrix
    term: square matrix
    short: A matrix with as many rows as columns.
    definition: A matrix with as many rows as columns, such as 2 by 2 or 4 by 4.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [row-and-column]
    used_in: []
    recall_question: What do we call a matrix with as many rows as columns?
    recall_answer: A square matrix, such as 4 by 4.

  - id: rectangular-matrix
    term: rectangular matrix
    short: A matrix whose numbers of rows and columns differ.
    definition: A matrix whose number of rows and number of columns differ, such as 2 by 3.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [row-and-column]
    used_in:
      - roadmap.md
    recall_question: What do we call a matrix whose numbers of rows and columns differ, such as 2 by 3?
    recall_answer: A rectangular matrix.

  - id: matrix-multiplication
    term: matrix multiplication
    short: Combining matrices A and B into C, where each cell of C comes from one row of A and one column of B.
    definition: >-
      An operation that combines a matrix `A` and a matrix `B` into a new
      matrix `C`, where each number in `C` is built from one row of `A` and one
      column of `B`. It is the first real Vortex program the guide builds.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [matrix, dot-product]
    used_in:
      - compiler/guide/stage-11-release.md
      - roadmap.md
      - backend/c2-liveness.md
      - backend/c3-linear-scan.md
      - backend/c4-graph-coloring.md
      - backend/c6-scheduling.md
      - optimize/o1-optimizer-contract.md
      - gpu/g10-matmul-ladder.md
      - gpu/g11-matrix-units.md
      - gpu/g13-tile-languages.md
      - gpu/g15-systolic-arrays.md
      - mlir/m2-reading-mlir.md
      - mlir/m5-structured-ops.md
      - mlir/m8-vectorization.md
      - mlir/m9-transform-dialect.md
      - mlir/m11-ml-compilers.md
      - mlir/m12-vortex-gpu-path.md
    recall_question: Which operation builds each cell of a matrix C from one row of A and one column of B?
    recall_answer: Matrix multiplication. Each cell of the result is one dot product.

  - id: dot-product
    term: dot product
    tooltip: true
    short: Multiplying two equal-length lists position by position and adding the results.
    definition: >-
      Multiplying two equally long lists of numbers position by position and
      adding up the results. Each cell of a matrix product is one dot product.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: []
    used_in:
      - gpu/g10-matmul-ladder.md
      - gpu/g11-matrix-units.md
      - gpu/g12-flashattention.md
      - gpu/g15-systolic-arrays.md
    recall_question: What do we call multiplying two equal-length lists position by position and adding up the results?
    recall_answer: A dot product. Each cell of a matrix product is one.

  - id: inner-dimension
    term: inner dimension
    tooltip: true
    short: The size that must match to multiply two matrices, the columns of A and the rows of B.
    definition: >-
      The size that must match for two matrices to be multiplied, namely the
      number of columns of `A` and the number of rows of `B`.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [matrix-multiplication, row-and-column]
    used_in:
      - gpu/g11-matrix-units.md
    recall_question: To multiply A by B, which size must match, and what is it called?
    recall_answer: The inner dimension, the number of columns of A, which must equal the number of rows of B.

  - id: known-answer
    term: known answer
    short: A result worked out independently, which a test compares the program's output against.
    definition: >-
      A result worked out independently, by hand or by trusted software, that a
      test compares the program's output against.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [test]
    used_in:
      - compiler/guide/stage-11-release.md
      - optimize/p1-measure-first.md
      - gpu/g11-matrix-units.md
      - gpu/g14-measuring-gpu-code.md
    recall_question: What is a result worked out independently, by hand or by trusted software, that a test compares the output against?
    recall_answer: A known answer.

  - id: tolerance
    term: tolerance
    short: How far apart two floating-point results may be and still count as equal.
    definition: How far apart two floating-point results may be and still count as equal.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [ieee-754]
    used_in:
      - optimize/p16-capstone.md
      - gpu/g11-matrix-units.md
      - gpu/g12-flashattention.md
    recall_question: When a test compares floating-point results, what says how far apart they may be and still count as equal?
    recall_answer: The tolerance.

  - id: naive
    term: naive
    short: Written in the most direct way, with no attempt to make it fast.
    definition: >-
      Written in the most direct way, with no attempt to make it fast. The
      roadmap calls the v0.1 matrix multiplication straightforward and
      unoptimized.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: []
    used_in:
      - optimize/p1-measure-first.md
      - optimize/p3-roofline.md
      - gpu/g4-memory-performance.md
      - gpu/g10-matmul-ladder.md
      - gpu/g14-measuring-gpu-code.md
    recall_question: What do we call code written in the most direct way, with no attempt to make it fast?
    recall_answer: Naive, like the straightforward, unoptimized v0.1 matrix multiplication.

  - id: loop-nest
    term: loop nest
    short: Loops placed inside other loops; matrix multiplication is usually three deep.
    definition: Loops placed inside other loops. Matrix multiplication is usually three loops deep.
    introduced_in: compiler/guide/stage-10-matrix-multiplication.md
    requires: [loop-variable]
    used_in:
      - backend/c2-liveness.md
      - backend/c6-scheduling.md
      - optimize/p6-dependence-analysis.md
      - optimize/p7-loop-transformations.md
      - gpu/g1-throughput-machines.md
      - gpu/g13-tile-languages.md
      - gpu/g15-systolic-arrays.md
    recall_question: What do we call loops placed inside other loops, such as the three loops of matrix multiplication?
    recall_answer: A loop nest.

  # ---- Compiler guide 11. Release ------------------------------------------

  - id: release
    term: release
    short: A version of the compiler given a name and offered to others as working, with its limits stated.
    definition: >-
      A version of the compiler that is given a name and offered to other
      people as working, with its limits stated.
    introduced_in: compiler/guide/stage-11-release.md
    requires: []
    used_in:
      - roadmap.md
    recall_question: What is a named version of the compiler, offered to others as working with its limits stated, called?
    recall_answer: A release.

  - id: release-gate
    term: release gate
    tooltip: true
    short: The list of checks that must all pass before a release may be named.
    definition: The list of checks that must all pass before a release may be named.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [release, test-suite]
    used_in:
      - roadmap.md
    recall_question: What is the list of checks that must all pass before a release may be named?
    recall_answer: The release gate.

  - id: version-number
    term: version number
    short: The name given to a release, such as v0.1.0, so people can say exactly which compiler they used.
    definition: >-
      The name given to a release, such as `v0.1.0`. It lets people say
      exactly which compiler they used.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [release]
    used_in: []
    recall_question: What lets people say exactly which release of the compiler they used, such as `v0.1.0`?
    recall_answer: The version number.

  - id: test-suite
    term: test suite
    short: The whole collection of automated tests for the compiler.
    definition: The whole collection of automated tests for the compiler, which the test runner runs.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [test, test-runner]
    used_in:
      - roadmap.md
    recall_question: What is the whole collection of automated tests for the compiler called?
    recall_answer: The test suite.

  - id: valid-and-invalid-pair
    term: valid and invalid pair
    tooltip: true
    short: Two nearly identical test programs, one accepted and one rejected, showing a rule is enforced exactly.
    definition: >-
      Two small test programs, one that must be accepted and a nearly identical
      one that must be rejected, which together show a rule is enforced exactly
      where it should be.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [valid-program, invalid-program]
    used_in: []
    recall_question: Which pair of nearly identical test programs shows that a rule is enforced exactly where it should be?
    recall_answer: A valid and invalid pair, one accepted and one rejected.

  - id: end-to-end-test
    term: end-to-end test
    short: A test that runs the whole compiler on a source file, runs the result, and checks what comes out.
    definition: >-
      A test that runs the whole compiler on a source file, runs the resulting
      executable if there is one, and checks what comes out.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [test, executable]
    used_in:
      - roadmap.md
      - compiler/architecture.md
    recall_question: Which kind of test runs the whole compiler on a source file, runs the result and checks what comes out?
    recall_answer: An end-to-end test.

  - id: clean-checkout
    term: clean checkout
    short: A fresh copy of the project's files with nothing left over from earlier builds.
    definition: A fresh copy of the project's files, with nothing left over from earlier builds.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [clean-configuration]
    used_in:
      - roadmap.md
    recall_question: What is a fresh copy of the project's files, with nothing left over from earlier builds, called?
    recall_answer: A clean checkout.

  - id: known-limitation
    term: known limitation
    short: Something the language describes but this compiler does not yet do, written down so nobody is surprised.
    definition: >-
      Something the language describes that this compiler does not yet do,
      written down so users are not surprised by it.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [release]
    used_in:
      - roadmap.md
    recall_question: What do we call something the language describes that this compiler does not yet do, written down for users?
    recall_answer: A known limitation.

  - id: implementation-limit
    term: implementation limit
    short: A point where a compiler supports less than the language allows; it must be documented.
    definition: >-
      A point where a compiler supports less than the language allows, such as
      a maximum array size. The conformance chapter requires these to be
      documented.
    spec_ref: specification/conformance.md#13-implementation-conformance
    introduced_in: compiler/guide/stage-11-release.md
    requires: [known-limitation]
    used_in: []
    recall_question: What do we call a point where a compiler supports less than the language allows, such as a maximum array size?
    recall_answer: An implementation limit. The specification requires it to be documented.

  - id: expected-failure
    term: expected failure
    tooltip: true
    short: A test known to fail and marked that way on purpose, usually because it covers a known limitation.
    definition: >-
      A test that is known to fail and is marked that way on purpose, usually
      because it tests a known limitation.
    introduced_in: compiler/guide/stage-11-release.md
    requires: [known-limitation, test]
    used_in: []
    recall_question: What is a test that is known to fail, and marked that way on purpose, called?
    recall_answer: An expected failure, usually a test of a known limitation.

  # ---- Defined only in the word list ---------------------------------------

  - id: tree-walk-interpreter
    term: tree-walk interpreter
    tooltip: true
