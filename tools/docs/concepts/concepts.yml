    recall_question: "Which term does the specification use for this idea: in v0.1, an integer constant expression: integer literals, each optionally preceded by unary -, combined...?"
    recall_answer: >-
      Constant expression. In v0.1, an integer constant expression: integer
      literals, each optionally preceded by unary -, combined with parentheses
      and the binary operators +, -, , / and %. Names and calls are never
      constant expressions. See Expressions.

  - id: deciding-operand
    term: deciding operand
    short: "An operand whose value decides whether a checked operation fails: the divisor for division by zero, the..."
    definition: >-
      An operand whose value decides whether a checked operation fails: the
      divisor for division by zero, the count for a shift, the index for bounds,
      the operand for a cast, and every operand for overflow. See Expressions
      5.12.
