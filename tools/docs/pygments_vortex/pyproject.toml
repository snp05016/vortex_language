[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-vortex"
version = "0.1.0"
description = "Pygments lexer for the Vortex language, used by the Vortex docs site."
requires-python = ">=3.10"
dependencies = ["pygments>=2.17"]

# Registers the lexer so ```vortex fences are highlighted at build time.
[project.entry-points."pygments.lexers"]
vortex = "pygments_vortex:VortexLexer"
