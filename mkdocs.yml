markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress.css
  - https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css

extra_javascript:
  - javascripts/theme.js
  - javascripts/katex.js
  - javascripts/workbook.js
  - javascripts/progress.js
  - https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/contrib/auto-render.min.js
