site_name: Vortex
site_description: A small, statically typed language for numerical kernels, its specification, and a guide to building its compiler.
site_author: Saumya Patel
site_url: https://snp05016.github.io/vortex_language/
repo_name: snp05016/vortex_language
repo_url: https://github.com/snp05016/vortex_language
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Vortex is an evolving language specification. Specified behavior is not necessarily implemented behavior.

# Built with Zensical (classic variant = Material for MkDocs look). The same
# file stays buildable with Material for MkDocs 9.7 as a fallback.
theme:
  name: material
  variant: classic
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - content.action.edit

