# Vale 3.x prose lint for the docs site (https://vale.sh).
# Run from the repo root:  vale docs
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Read Markdown as MDX, where indentation never starts a code block. As plain
# Markdown, the indented body of an admonition (!!!), details block (???) or
# content tab (===) would count as code and go unchecked.
[formats]
md = mdx

[docs/**/*.md]
BasedOnStyles = Vale, Vortex
# Spelling is codespell's job (.codespellrc). Vale's dictionary flagged 556
# words here, all jargon and cited authors' names, none of them typos.
Vale.Spelling = NO
# Inline SVG diagrams are not prose. MDX mode ignores SkippedScopes for raw
# HTML, so the whole element is turned into a code block instead. Fenced code
# and inline code are already skipped.
# Footnote definitions quote source titles verbatim ("...Obviously Wrong!"),
# so they are not checked either.
BlockIgnores = (?s)(<svg[\s>].*?</svg>), (?m)(^\[\^[^\]]+\]:.*$)
